[project]
name = "image-editing-tools-mcp"
version = "0.1.0"
description = "MCP server and CLI tools for printable passport photo sheets and photo collages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harshad Vaishampayan", email = "vmharshad@gmail.com" }]
keywords = ["mcp", "passport-photo", "collage", "pillow", "printing"]

dependencies = [
    "mcp>=1.2.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/HarshadVaishampayan/image_editing_tools"

[project.scripts]
image-editing-tools-mcp = "mcp_server:main"
photo-grid = "image_grid_cli:main"
photo-collage = "collage_maker_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "mcp_server.py",
    "image_grid_cli.py",
    "collage_maker_cli.py",
]
sources = ["."]
